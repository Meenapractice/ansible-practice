- name: "loops"
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: "loops"
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
    - { name: "nginx", state: "absent" }
    - { name: "mysql", state: "absent" }
    - { name: "nodejs", state: "present" }l