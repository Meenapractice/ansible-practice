- name: "filters"
  hosts: local
  connection: local
  vars:
    Topics: Ansible, Linux, Shell, Terraform
    tagsMap:
      COURSE: Devops
      TRAINER: Meena
  tasks:
  - name: "Greetings"
    ansible.builtin.debug:
      msg: "Hi Meena, {{ GREETINGS | default('Good Morning') }}"
  
  - name: "String to List"
    ansible.builtin.debug:
      msg: "{{ Topics | split(',') }}"

  - name: "Map to List"
    ansible.builtin.debug:
      msg: "{{ tagsMap | dict2items }}"

  - name: "Set the file to variable"
    ansible.builtin.set_fact:
      student_yaml: "{{ lookup('file', students.yaml) | from_yaml }}" 
  - name: "Yaml to json"
    ansible.builtin.debug:
      msg: "{{ student_yaml | to_nice_json }}"


  